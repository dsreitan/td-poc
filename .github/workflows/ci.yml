name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: "22"
          cache: true
      - run: vp install
      - run: vp check
      - run: vp test
      - run: vp build
